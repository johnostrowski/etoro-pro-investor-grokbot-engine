# Content type registry — the single source for WHAT ships and WHEN.
#
# Read by your agents before they plan a week, and by tools/content_strategy/build.py, which sums
# the hours and writes tiers.md. Change a cadence here first, then run the script.
#
# minutes    = your own time per piece (review, record, post, reply to comments). Drafting time
#              is the team's and is not counted. Treat every figure as an estimate until you have
#              a quarter of Monday logs.
# per_month  = pieces per month (4.33 = weekly, 2.17 = every two weeks, 0.33 = quarterly).
# shelf_days = how long a draft may wait in Review before it is reworked. 0 = never expires.
# status     = "active" | "paused" | "gated". Gated types are listed but not counted: check your
#              platform's rule first (the copy invite is a call to action).
# owner      = the seat accountable for the type shipping. On a Starter team the Content Lead
#              holds the cmo and cco seats.
# fuel       = who supplies the raw material.
# first_draft = "team" or "owner". At level 2 the bar raiser re-pulls every number in a report.
# bar_raiser = "level-2" where a second check applies once you add it; see system/bar-raiser.md.

version = "1.0"
updated = "2026-11-15"

[tiers.starter]
label = "Starter"
cap_hours_per_week = 3
promise = "The promises and one habit. Nothing else."

[tiers.core]
label = "Core"
cap_hours_per_week = 5
promise = "Adds the weekly clip reaction, video on the monthly, the question series, dated milestones and a second reply session."

[tiers.full]
label = "Full"
cap_hours_per_week = 8
promise = "Adds the eToro long form every two weeks, the video episodes, a third reply session, every earnings check and four event campaigns."

